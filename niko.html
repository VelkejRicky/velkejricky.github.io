<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYS NIKOLO</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 14vw;
      text-shadow: 0 0 10px #ff0080, 0 0 20px #ff0080, 0 0 40px #ff0080;
      animation: pulse 1.5s infinite alternate;
      margin-bottom: 20px;
    }

    p {
      font-size: 5vw;
      color: #ffea00;
      text-shadow: 0 0 5px #ffea00, 0 0 10px #ffea00;
      animation: flicker 2s infinite;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
        text-shadow: 0 0 10px #ff0080, 0 0 20px #ff0080, 0 0 40px #ff0080;
      }
      to {
        transform: scale(1.05);
        text-shadow: 0 0 20px #ff0080, 0 0 40px #ff0080, 0 0 60px #ff0080;
      }
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
      }
      20%, 24%, 55% {
        opacity: 0.4;
      }
    }

  </style>
</head>
<body>
  <h1>KYS NIKOLO</h1>
  <p>Kouření zabíjí</p>
</body>
</html>
