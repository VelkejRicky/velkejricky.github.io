<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KYS NIKOLO</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #ffb6c1, #ffe4e1, #ff69b4);
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    h1 {
      font-size: 14vw;
      text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493, 0 0 40px #ff1493;
      animation: pulse 1.5s infinite alternate;
      margin-bottom: 20px;
    }

    p {
      font-size: 5vw;
      color: #ffff99;
      text-shadow: 0 0 5px #ffff99, 0 0 10px #ffff99;
      animation: flicker 2s infinite;
      margin-bottom: 30px;
    }

    .flowers {
      font-size: 6vw;
      animation: spin 10s linear infinite;
      margin-bottom: 20px;
    }

    .image {
      width: 30vw;
      max-width: 150px;
      border: 5px solid #ff69b4;
      border-radius: 20px;
      box-shadow: 0 0 20px #ff1493, 0 0 30px #ff69b4;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
        box-shadow: 0 0 20px #ff1493, 0 0 30px #ff69b4;
      }
      to {
        transform: scale(1.05);
        box-shadow: 0 0 30px #ff1493, 0 0 50px #ff69b4;
      }
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
      }
      20%, 24%, 55% {
        opacity: 0.5;
      }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="flowers">🌸🌼🌸🌼🌸🌼🌸</div>
  <h1>KYS NIKOLO</h1>
  <p>Kouření zabíjí</p>
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Stop_smoking_sign.svg/800px-Stop_smoking_sign.svg.png" alt="Stop kouření" class="image">
  <div class="flowers">🌼🌸🌼🌸🌼🌸🌼</div>
</body>
</html>
